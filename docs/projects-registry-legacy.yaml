# RETIRED 2026-08-08 (Session 35 Phase 4). Nothing reads this file.
#
# Kept verbatim because its comments were the only record of several
# decisions. Those are being transferred into the `decisions:` blocks of
# each project's own `.project.yaml`, by hand, one project at a time —
# not parsed out of here by a script, which would flatten the reasoning
# into a field and lose the part that mattered.
#
# Where each half went:
#   backend/frontend endpoints, logs  ->  services.yaml (keyed by id)
#   name, path, status, alert_threshold  ->  <project>/.project.yaml
#
# Delete this file once every comment below appears in a manifest.

# Managed projects: endpoints to health-check, logs to aggregate, and
# optional per-project overrides.
#
# alert_threshold: health-score floor below which the project organiser
#   raises a warning alert. Omit it to use the global
#   agents.project_organiser.alert_threshold (40). Matched against the
#   scanned project by path first, then by this name, then by the
#   basename of `path` — so an entry named `alfred` pointing at an
#   `Alfred` directory still applies. Example:
#
#   - name: some-archive
#     path: /home/gaddi/projects/some-archive
#     alert_threshold: 0     # never alert — deliberately dormant
#
projects:
  # Alfred — replaced PersonalAssistant on 2026-07-24. Both halves are
  # systemd *user* units, so `user: true` is required: without it the
  # health check and log read run against the system scope, which never
  # knows about the unit and fails silently (exactly how the old PA
  # entries broke). The log source inherits `user` from its endpoint.
  - name: alfred
    path: /home/gaddi/projects/Alfred
    backend:
      url: http://localhost:8100/api/health   # /health and /api/v1/health both 404
      port: 8100
      systemd_unit: alfred-backend.service
      user: true
      log:
        type: journalctl
        unit: alfred-backend.service
        severity_filter: warning
    frontend:
      url: http://localhost:3100              # Nuxt/Nitro
      port: 3100
      systemd_unit: alfred-frontend.service
      user: true
      log:
        type: journalctl
        unit: alfred-frontend.service
        severity_filter: warning

  # Scan-only: an Android/Gradle project, no service and no port.
  - name: alfred-glance
    path: /home/gaddi/projects/apps/alfred-glance

  - name: sysadmin-service
    path: /home/gaddi/projects/sysadmin_assistant
    backend:
      url: http://localhost:8500/health
      port: 8500
      systemd_unit: sysadmin.service
      log:
        type: journalctl
        unit: sysadmin.service
        severity_filter: warning

  # Directory is CamelCase on disk; the old lowercase path matched nothing
  # on a case-sensitive filesystem, so this entry was silently dead until
  # 2026-08-04. Systemd units + logs wired 2026-08-05 — the units existed
  # since before then but were unmonitored (URL-only checks). All three
  # sportsanalyser units are *user* units. The daily pipeline is
  # Type=oneshot, so its TIMER is monitored instead — but that lives in
  # config.yaml's agents.sysadmin.services (this file only models
  # backend/frontend endpoints).
  # Dormant 2026-08-06: last code change 2026-03-23 (Phase 12A retrain).
  # Its handoff is a faithful record of where work stopped, so the board
  # flagged it stalled at 152 days — declaring it dormant *is* the
  # resume-or-park decision that flag was asking for. Endpoints stay
  # monitored: the services are still running and still worth alerting on.
  - name: sports_analyser
    path: /home/gaddi/projects/apps/SportsAnalyser
    status: dormant
    backend:
      url: http://localhost:8200/api/v1/health
      port: 8200
      systemd_unit: sportsanalyser-backend.service
      user: true
      log:
        type: journalctl
        unit: sportsanalyser-backend.service
        severity_filter: warning
    frontend:
      url: http://localhost:3200              # Next.js
      port: 3200
      systemd_unit: sportsanalyser-frontend.service
      user: true
      log:
        type: journalctl
        unit: sportsanalyser-frontend.service
        severity_filter: warning

  # --- Dormant: wanted eventually, not being worked on --------------------
  # Declared 2026-08-06. `dormant` is the lighter touch than `archived`:
  # commit staleness stops being penalised and roadmap advice is waived,
  # but everything else is still scored and they stay on the board when
  # asked for. Dates below are the last commit that changed *code* — the
  # 2026-08-04/05 "WIP snapshot before ~/projects reorganisation" commit
  # touched every repo on the box and is not work.
  #
  # Undeclared projects default to `active`, which is why the board showed
  # 18 rows for a five-project estate. Declaring intent is the fix; it is
  # cheaper than any document these repos could be given.
  - name: daiy
    path: /home/gaddi/projects/apps/daiy
    status: dormant          # last code 2026-02-06 (finger calibration)

  - name: BSL-Translator
    path: /home/gaddi/projects/apps/BSL-Translator
    status: dormant          # last code 2026-01-10 (phase 2 merge)

  - name: BudgetApp
    path: /home/gaddi/projects/apps/BudgetApp
    status: dormant          # last code 2025-05-14; transaction blueprint never written

  - name: InvestingAssistant
    path: /home/gaddi/projects/apps/InvestingAssistant
    status: dormant          # last code 2026-02-13 (initial scaffold only)

  - name: terrible
    path: /home/gaddi/projects/games/terrible
    status: dormant          # last code 2026-03-25 (get_component API fix)

  - name: portfolionew
    path: /home/gaddi/projects/web/portfolionew
    status: dormant          # no commits at all — git init, never committed

  # SportsAnalyser's entry is above with its endpoints; it is dormant too
  # (last code 2026-03-23). Declared there rather than duplicated here.
  #
  # Athenaeum: 2.9 MB of real source with ZERO commits and no remote, plus
  # 15 GB of rebuildable .venv/node_modules. Deliberately left `active` —
  # marking it dormant would waive the advice while the only copy of the
  # work still exists nowhere but this disk. Commit it first.
  - name: Athenaeum
    path: /home/gaddi/projects/ml/Athenaeum

  # venture-assistant — wired 2026-08-06; real FastAPI backend claimed
  # port 8300 on 2026-08-07 (venture-assistant-backend.service, /api/health
  # answers 200 even when the llama servers are down — "degraded" in the
  # body, so a failing check means the API itself is dead).
  #
  # The project's three other units are deliberately NOT here (this file
  # models only one backend + one frontend per project):
  #   - venture-chat.service      → config.yaml (was the stand-in backend
  #                                 here until the real one existed)
  #   - venture-embed.service     → config.yaml
  #   - venture-chat-large.service → not monitored at all. It is `static`
  #     and pulled up only by venture-enrich-nightly.service for the 02:00
  #     drain, then stopped by its ExecStopPost. Inactive between runs by
  #     design — the same reasoning that makes us monitor timers rather
  #     than oneshot services.
  #
  # Port 8080 is llama.cpp's default and the most contended port on the
  # box; it is recorded in the registry but should move to 83xx when the
  # llama units are next touched (app/config.py:10 is the only consumer).
  - name: venture-assistant
    path: /home/gaddi/projects/apps/venture-assistant
    backend:
      url: http://localhost:8300/api/health
      port: 8300
      systemd_unit: venture-assistant-backend.service
      user: true
      log:
        type: journalctl
        unit: venture-assistant-backend.service
        severity_filter: warning

  # --- Retired but retained -------------------------------------------
  # PersonalAssistant is dead (superseded by Alfred) but the repos are
  # kept on disk under archive/. They stay listed so they remain visible
  # in the dashboard and eligible for stale-branch pruning.
  #
  # `status: archived` (Session 21) waives exactly two deductions —
  # commit staleness and stale branches — and suppresses health alerts
  # absolutely, at any score, unless an explicit alert_threshold is set.
  # It is NOT a general git-hygiene exemption, which is what this comment
  # claimed until SNAG-PROJ-011: a leftover .git/index.lock still costs
  # an archived project 5 points, and a missing remote is still reported.
  # Anything under archive/ is inferred archived anyway — these are
  # explicit as the worked example. `status: dormant` is the lighter
  # touch: staleness unpenalised, everything else still scored.
  # Do not add endpoints here — nothing is meant to be listening.
  - name: PersonalAssistant
    path: /home/gaddi/projects/archive/PersonalAssistant
    status: archived

  - name: PersonalAssistant-auto
    path: /home/gaddi/projects/archive/PersonalAssistant-auto
    status: archived

  # --- Empty shells, archived 2026-08-06 -------------------------------
  # Each of these is a directory containing a .git and nothing else: zero
  # tracked files, zero commits, 56–76K on disk. They were discovered as
  # "active" only because an undeclared project defaults to active, and
  # they were about to be issued roadmap documents for code that does not
  # exist. Declared rather than deleted so the decision is recorded and
  # reversible — `git init` was run here once, intent unknown.
  - name: DotaImprover
    path: /home/gaddi/projects/ml/DotaImprover
    status: archived

  - name: TeacherPlanner
    path: /home/gaddi/projects/apps/TeacherPlanner
    status: archived

