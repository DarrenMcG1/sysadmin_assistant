name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # PyQt6 tray tests run headless
      QT_QPA_PLATFORM: offscreen
      # The box's clock and interpreter, which the suite measures against.
      # TZ: the ops-claims tests read STATUS.md's times in the box's zone,
      # and in UTC twelve of them report zone drift that is not there.
      # UV_PYTHON: the coverage-arc tests drive the real `coverage --branch`
      # through an ephemeral `uv run --with`, and 3.12.3 (the runner's
      # system Python) lays out a comprehension's arcs differently from the
      # box's 3.12.12, failing four. It reaches the ephemeral run too, which
      # a setup-python step would not. Move it when the box's Python moves.
      TZ: Europe/London
      UV_PYTHON: "3.12.12"
    # pyproject.toml resolves estate-lib at ../estate-manager/lib, and
    # actions/checkout will not write outside the workspace, so both
    # repositories are checked out as siblings inside it (SNAG-TEST-015).
    defaults:
      run:
        working-directory: sysadmin_assistant
    steps:
      # Full history: the briefing guards walk every commit that touched
      # the producer, and a depth-1 clone gives them one.
      - uses: actions/checkout@v4
        with:
          path: sysadmin_assistant
          fetch-depth: 0

      # estate-manager is private. The secret is the private half of a
      # read-only deploy key on that repository and reads nothing else;
      # pull requests from forks are not given it.
      - name: Check out estate-manager beside this repository
        uses: actions/checkout@v4
        with:
          repository: DarrenMcG1/estate-manager
          path: estate-manager
          ssh-key: ${{ secrets.ESTATE_MANAGER_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install PyQt6 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0

      - name: Install dependencies
        run: uv sync --extra dev --extra tray

      # The cross-repo pins skip only when the estate-manager tree is
      # absent; with it present they need estate_service importable, as it
      # is on the box. It is in no lockfile, so it goes in the way the box
      # installs it, and the steps below run with --no-sync.
      - name: Install estate_service for the cross-repo pins
        run: uv pip install --no-deps -e ../estate-manager/service

      - name: Ruff
        run: uv run --no-sync ruff check .

      - name: Pytest
        # `box` tests read this machine itself: the projects database's rows,
        # ~/.claude/settings.json, the journal, systemctl --user and the
        # installed unit files. They fail rather than skip without it, so CI
        # leaves them out here and says so; the box still runs them all
        # (SNAG-TEST-015). Until estate-manager pushes its main, the
        # estate-lib checked out here is older than the box's and some
        # tests still fail on that.
        run: uv run --no-sync pytest -m "not box"
