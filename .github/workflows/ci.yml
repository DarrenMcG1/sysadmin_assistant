name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # PyQt6 tray tests run headless
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install PyQt6 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0

      - name: Install dependencies
        run: uv sync --extra dev --extra tray

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        # The schema drift guard (tests/test_schema_drift.py) skips itself
        # when the local postgres is unreachable, so no DB service is needed.
        run: uv run pytest
