# What this host runs, and how each thing is checked.
#
# Replaces the runtime half of projects.yaml (backend/frontend endpoints)
# and the agents.sysadmin.services block in config.yaml. Projects are
# referenced by `project:` id, resolved through estate.registry against
# the .project.yaml manifests. There are deliberately no paths in this
# file: an id that names nothing fails at load, a path that names nothing
# fails silently, and this estate has been bitten by the latter twice.
#
# `kind` decides the check:
#   http     poll `url`, and assert the unit is active when one is named
#   tcp      open a socket to host:port
#   systemd  assert the unit is active
#   timer    assert the TIMER is active and inspect its last run; the
#            service it triggers is never checked
#   oneshot  never check active state — inactive between runs by design
#   static   never check — pulled up on demand, not expected to be running
#
# `monitor: false` suppresses checking entirely and REQUIRES a `reason`.
# `systemd.scope` is user or system and defaults to **user**: most units
# here are user units, and the old `user: true` opt-in meant an omission
# sent the check to the system bus, where the unit is simply unknown and
# the failure is silent.
#
# Service `name` values are the historical ones. They are the key in
# service_health, reliability scores and the tray's mute list, so renaming
# one to something tidier (`alfred` -> `alfred-backend`) would orphan its
# history. `role` carries the tidier label instead.

schema: 1

services:

  # --- Alfred ---------------------------------------------------------
  # Four services, which is why three of them lived in config.yaml until
  # now: projects.yaml could model a backend and a frontend and nothing
  # else, so the inference server and both timers were exiled with
  # comments explaining that they belonged to a project the file could
  # not express.
  - project: alfred
    name: alfred
    role: backend
    kind: http
    url: http://localhost:8100/api/health   # /health and /api/v1/health both 404
    port: 8100
    systemd: { unit: alfred-backend.service, scope: user }
    log: { type: journalctl, severity_filter: warning }

  - project: alfred
    name: alfred-frontend
    role: frontend
    kind: http
    url: http://localhost:3100              # Nuxt/Nitro
    port: 3100
    systemd: { unit: alfred-frontend.service, scope: user }
    log: { type: journalctl, severity_filter: warning }

  # `holds_vram: true`: llama-server runs with `-ngl 99`, so the model
  # sits in VRAM and an amdgpu MODE1 reset destroys the context it is
  # serving from. Measured over 2026-08-05 → 09-08: 6 of 6 aborts on this
  # unit were preceded by a context created before the last reset, and
  # 0 of 3,020 successful requests were served while that was true.
  # ADR-0007 records the derivation; `role: inference` is deliberately
  # NOT the key, because `venture-embed` carries it and holds no VRAM.
  - project: alfred
    name: llama-server
    role: inference
    kind: http
    url: http://localhost:8081/health
    port: 8081
    holds_vram: true
    systemd: { unit: alfred-inference.service, scope: user }
    log: { type: journalctl, severity_filter: warning }

  # Nightly evaluation. The service is Type=oneshot and therefore
  # inactive/dead between runs, so the timer is what carries the signal —
  # an inactive timer genuinely means the schedule has stopped.
  - project: alfred
    name: alfred-evaluate-timer
    role: schedule
    kind: timer
    systemd: { unit: alfred-evaluate.timer, scope: user }
    controllable: false

  # Five-minute personal-event evaluator (Alfred ADR-0079 §4), added
  # 2026-08-27 the same day the unit was created. Same oneshot entrypoint
  # as alfred-evaluate, differing only by --bucket=frequent, so it is a
  # second cadence rather than a second program. The timer carries the
  # signal for the same reason as its sibling: the service is Type=oneshot
  # and inactive between runs by design.
  #
  # It is the highest-frequency unit on this host by an order of magnitude
  # (288 fires/day against alfred-evaluate's 1), which is what makes it
  # worth watching: measured at 0.51s wall / 0.48s CPU / 78 MiB peak per
  # fire, so a regression that turns it into a multi-second job would cost
  # real time on a daily-driver machine before anyone noticed by feel.
  # Deliberately NOT Persistent=true, so a missed fire is skipped rather
  # than replayed — an inactive timer here means the schedule has stopped
  # and nothing will catch up.
  - project: alfred
    name: alfred-evaluate-frequent-timer
    role: schedule
    kind: timer
    systemd: { unit: alfred-evaluate-frequent.timer, scope: user }
    controllable: false

  # Daily 08:20 career-mail ingest. Offset from alfred-evaluate's 08:00
  # because both touch the dGPU. The service is `static` by design — no
  # [Install], driven solely by its timer.
  - project: alfred
    name: alfred-career-mail-timer
    role: schedule
    kind: timer
    systemd: { unit: alfred-career-mail.timer, scope: user }
    controllable: false

  # The Alfred desktop shell, given a unit on 2026-09-09 (Alfred ADR-0093)
  # after it was found dead since the 2026-09-06 boot with nothing to say so.
  # Same discovery story as sysadmin-tray below, and the same shape for the
  # same reasons — but a different cause: the tray had never been started at
  # all, whereas this one had been started by tauri-plugin-autostart's XDG
  # entry, whose generated unit carries an unconditional Restart=no. The
  # .desktop format cannot express a restart policy, so there was no surface
  # to configure; the repo-tracked unit is what created one.
  #
  # `monitor: false` for the tray's reason exactly: PartOf=graphical-session
  # .target makes it inactive by construction whenever nobody is logged in,
  # so a check would alert every night and teach the reader to ignore it.
  # What makes that acceptable rather than a hole is that the crash case —
  # the only failure that has ever killed it — is now covered by
  # Restart=on-failure, verified on the box by kill -ABRT recovering in 8s.
  #
  # No port and no health path: the shell binds nothing and serves no HTTP
  # surface, so it earns no §2.1 registry row and no health: marker (the
  # monitorable-project contract's out-of-scope list, §2.2).
  #
  # Worth knowing for the GPU work: this unit is the *foreground application*
  # half of ADR-0007's _GPU_RESET.reason — the half §2.1 left standing when
  # it measured the resident-inference half false on venture-embed. Four
  # aborts over 2026-08-29 → 09-06, every one clustered with Xwayland,
  # plasmashell and WebKitWebProcess. It holds no VRAM, so holds_vram is
  # correctly absent; it loses a *graphics* context, not a model.
  - project: alfred
    name: alfred-desktop
    role: desktop
    kind: systemd
    monitor: false
    reason: >-
      GUI unit bound to graphical-session.target — inactive by design
      whenever nobody is logged in; a check would alert every night.
      Restart=on-failure covers the crash case (amdgpu context loss).
    systemd: { unit: alfred-desktop.service, scope: user }
    controllable: false

  # --- SportsAnalyser -------------------------------------------------
  # Dormant since 2026-08-06, but the services are still running and
  # still worth alerting on, so they stay monitored.
  - project: sports-analyser
    name: sports_analyser
    role: backend
    kind: http
    url: http://localhost:8200/api/v1/health
    port: 8200
    systemd: { unit: sportsanalyser-backend.service, scope: user }
    log: { type: journalctl, severity_filter: warning }

  - project: sports-analyser
    name: sports_analyser-frontend
    role: frontend
    kind: http
    url: http://localhost:3200              # Next.js
    port: 3200
    systemd: { unit: sportsanalyser-frontend.service, scope: user }
    log: { type: journalctl, severity_filter: warning }

  - project: sports-analyser
    name: sportsanalyser-pipeline-timer
    role: schedule
    kind: timer
    systemd: { unit: sportsanalyser-pipeline.timer, scope: user }
    controllable: false

  # --- venture-assistant ----------------------------------------------
  # Five services. The real FastAPI backend claimed port 8300 on
  # 2026-08-07; /api/health answers 200 even when the llama servers are
  # down ("degraded" in the body), so a failing check means the API
  # itself is dead.
  - project: venture-assistant
    name: venture-assistant
    role: backend
    kind: http
    url: http://localhost:8300/api/health
    port: 8300
    systemd: { unit: venture-assistant-backend.service, scope: user }
    log: { type: journalctl, severity_filter: warning }

  # Port 8080 is llama.cpp's default and the most contended port on this
  # box. Recorded in the registry, but should move to 83xx when the llama
  # units are next touched.
  # `holds_vram: true` for the same reason as llama-server above, and on
  # the larger population: this unit aborted on the reset signature 10
  # times in the same 34-day window — more than alfred-inference's 6 —
  # and reported `ok` throughout every one of them. 0 of 8,545 successful
  # requests were served while its context predated the last reset.
  - project: venture-assistant
    name: venture-chat
    role: inference
    kind: http
    url: http://localhost:8080/health
    port: 8080
    holds_vram: true
    systemd: { unit: venture-chat.service, scope: user }

  # No `holds_vram:` on purpose, and it is the measurement that decided
  # the whole population is a declaration rather than `role: inference`.
  # This runs `llama-server … -ngl 0` — no offloaded layers, no resident
  # VRAM — and served 267 of its 823 successful embeddings *while* its
  # context predated the last reset, with zero aborts in its whole
  # retained history. Keyed on the role it shares with the two above,
  # this reading would have raised 267 false alarms here.
  - project: venture-assistant
    name: venture-embed
    role: inference
    kind: http
    url: http://localhost:8082/health
    port: 8082
    systemd: { unit: venture-embed.service, scope: user }

  - project: venture-assistant
    name: venture-enrich-nightly-timer
    role: schedule
    kind: timer
    systemd: { unit: venture-enrich-nightly.timer, scope: user }
    controllable: false

  # Pulled up only by venture-enrich-nightly for the 02:00 drain and
  # stopped by its ExecStopPost. Previously absent from every config file
  # rather than declared, which made "deliberately not watched"
  # indistinguishable from "nobody wired it up".
  - project: venture-assistant
    name: venture-chat-large
    role: inference
    kind: static
    monitor: false
    reason: >-
      pulled up by venture-enrich-nightly for the 02:00 drain and stopped
      by its ExecStopPost; inactive between runs by design
    systemd: { unit: venture-chat-large.service, scope: user }

  # --- This service ---------------------------------------------------
  # A system unit, unlike almost everything else here.
  - project: sysadmin-assistant
    name: sysadmin-service
    role: backend
    kind: http
    url: http://localhost:8500/health
    port: 8500
    systemd: { unit: sysadmin.service, scope: system }
    # `format: json` because this daemon logs one JSON document per record,
    # so journald's MESSAGE is the whole document. Without it `alert_title`
    # builds a 252-character title out of JSON that reaches a notification
    # body verbatim (SNAG-LOG-003). It is the only source on this box that
    # declares it, and the reader defaults to `text` — a declaration by the
    # source, never a guess by the reader.
    log: { type: journalctl, severity_filter: warning, format: json }

  # The tray, given a unit on 2026-08-11 after it was found not running:
  # nothing had ever started it. No autostart entry, no unit — it had only
  # ever been launched by hand, so the 2026-08-10 reboot ended it silently
  # and the estate lost its only notification surface for a day.
  #
  # `monitor: false`, and the reason is the unit's own design: it is
  # PartOf=graphical-session.target, so it is inactive by construction
  # whenever nobody is logged in. Checking it would raise an alert every
  # night and teach the reader to ignore the one surface that shows them.
  # What makes that acceptable — rather than a hole — is that the
  # *consequence* of a dead tray is now covered: the daemon's own
  # notifier (sysadmin/monitor/desktop.py, same day) speaks whenever the
  # tray is not polling, so a tray that dies mid-session is no longer a
  # notification blackout. Restart=on-failure handles the crash case.
  #
  # If a nightly "tray down" alert is ever wanted, this becomes
  # `kind: systemd` with monitor left at its default.
  - project: sysadmin-assistant
    name: sysadmin-tray
    role: tray
    kind: systemd
    monitor: false
    reason: >-
      GUI unit bound to graphical-session.target — inactive by design
      whenever nobody is logged in; a check would alert every night.
      A dead tray is covered by the daemon's own desktop notifier.
    systemd: { unit: sysadmin-tray.service, scope: user }
    controllable: false

  # --- estate-manager -------------------------------------------------
  # The estate's first runtime artefact (its Session 2, 2026-08-11): a
  # boot oneshot that asserts the broker's dynsec schema (roles, ACLs,
  # static clients) from estate-manager/mqtt/dynsec.yaml. It sets
  # RemainAfterExit=yes, so `active (exited)` is its healthy steady state
  # and `failed` means this boot's assertion did not complete. Until
  # estate-manager's scripts/install-broker-system-units.sh has been run
  # (the same sitting this entry was added), the unit is not yet
  # installed and this check will rightly complain.
  - project: estate-manager
    name: estate-broker-provision
    role: broker-provision
    kind: systemd
    systemd: { unit: estate-broker-provision.service, scope: system }
    controllable: false
    log: { type: journalctl, severity_filter: warning }

  # The estate's 8400 service (its Session 3 second half, 2026-08-12, its
  # ADR-0007): the GPU queue. Grants leases, performs the granite/24B swap
  # the units' Conflicts=/ExecStopPost wiring used to do, and restores the
  # baseline at release or lease expiry. Its /api/queue/invariants (depth,
  # oldest-waiting age, dropped count) is exposed to be judged HERE — the
  # estate never judges its own queue; that judging is this repository's
  # own upcoming task.
  - project: estate-manager
    name: estate-manager-api
    role: api
    kind: http
    url: http://localhost:8400/api/health
    port: 8400
    systemd: { unit: estate-manager-api.service, scope: user }
    # `format: json` from 2026-08-31, on estate-manager's announcement
    # `76e0438b` (their ADR-0079, closing their SNAG-ESTATE-092): the
    # estate's four entry points now emit one JSON document per record,
    # prefixed `<N>` so journald stamps a real PRIORITY. Without the
    # declaration `alert_title` builds the title out of the whole
    # document — SNAG-LOG-003, the defect the `sysadmin-service` entry
    # above already declares against. Driven against this unit's real
    # journal before the edit: 166 of 600 records change, titles fall
    # from 167-249 characters of JSON to 55-70 readable ones, `logger`
    # goes to metadata and `raw_line` keeps the envelope.
    #
    # It ships **untriggered, twice over**, and the second reason is the
    # one worth carrying: `FAULT_SEVERITIES` is error and critical, so
    # the `warning` filter's whole live population here is systemd's own
    # 28 stored `Failed with result 'exit-code'.` rows, which raise
    # nothing and are plain text anyway. And no estate application line
    # has yet arrived above priority 6 — all 34 non-6 records in 14 days
    # were written by systemd — so the producer's new prefix has no
    # witness here either. The declaration is a statement about what the
    # application writes, not a repair of an observed row.
    log: { type: journalctl, severity_filter: warning, format: json }

  # The estate's scan/review timers (Session 4: the scanner and the
  # weekly portfolio review moved to the 8400 service, replacing
  # sysadmin-organiser.timer). Watched here per the judging swap
  # (ADR-0005): the estate never judges its own scan, so its schedule is
  # this repository's to assert.
  - project: estate-manager
    name: estate-manager-scan-timer
    role: schedule
    kind: timer
    systemd: { unit: estate-manager-scan.timer, scope: user }
    controllable: false
    # `project_organiser` is in AGENT_NAMES and deliberately absent from
    # agent_schedules: this timer runs its work now. Declaring it makes
    # the handover a fact the daemon checks rather than one this comment
    # asserts — sysadmin/monitor/handover.py reads it, and would speak if
    # anything put that agent back on this daemon's schedule.
    agent: project_organiser

  - project: estate-manager
    name: estate-manager-review-timer
    role: schedule
    kind: timer
    systemd: { unit: estate-manager-review.timer, scope: user }
    controllable: false

  # The conformance audit (estate-manager Session 5, its ADR-0009), added
  # 2026-08-13 as part 1 of the delegated requirement its ADR-0009 §8
  # recorded in this repository's tasks.md. It could not add it itself:
  # ADR-0002's bounded exception closed the same day, so the estate may
  # no longer edit this repository's runtime-read config and records the
  # requirement here instead.
  #
  # Wiring the timer and judging /api/audit/invariants are two different
  # jobs and both are needed. This entry catches a timer that stops
  # firing; `estate_judge` catches an audit that runs and goes wrong.
  # Neither sees the other's fault.
  - project: estate-manager
    name: estate-manager-audit-timer
    role: schedule
    kind: timer
    systemd: { unit: estate-manager-audit.timer, scope: user }
    controllable: false

  # --- Host services --------------------------------------------------
  # No `project:`. These belong to the machine rather than to any
  # repository, which is what the unit sweep already calls a host unit.
  - name: postgresql
    kind: systemd
    systemd: { unit: postgresql.service, scope: system }
    controllable: false
    log: { type: journalctl, severity_filter: error }

  - name: networkmanager
    kind: systemd
    systemd: { unit: NetworkManager.service, scope: system }
    controllable: false

  # The estate bus (promoted 2026-08-11; schema owned by estate-manager
  # since its Session 2). Unmonitored until now — found while wiring the
  # provisioner in: a dead broker means alerts publish nowhere while
  # every consumer reconnect-loops silently, which is SNAG-13's shape at
  # estate scale. Alfred's ADR-0046 drop-in (now estate-owned) makes it
  # patient at boot; `failed` here is therefore a real fault, not a race.
  - name: mosquitto
    kind: systemd
    systemd: { unit: mosquitto.service, scope: system }
    controllable: false
    log: { type: journalctl, severity_filter: warning }

  # SearXNG — wired 2026-08-14, the day estate-manager deployed it
  # (its ADR-0010). Pre-staged here from 2026-08-13; the two fields that
  # were unknowable then are settled below, and one of the two guesses
  # was wrong in the direction that would have mattered.
  #
  # The deploy is two processes, and this is deliberately ONE entry:
  #   * 8600 — the estate's shim, this entry. It serves /api/health in
  #     the contract's shape and proxies everything else.
  #   * 8601 — SearXNG's own container, bound to loopback and reachable
  #     only through the shim. Its unit file says it "intentionally has
  #     no health endpoint of its own worth monitoring", and a container
  #     that is down already shows up here as a 503. A second entry
  #     would give one fault two owners and two alert rows.
  #
  # The url is /api/health and NOT /healthz, which is the guess this
  # block shipped with. The shim proxies unknown paths upstream, so
  # http://localhost:8600/healthz reaches SearXNG's own liveness ping and
  # returns 200 whenever the container is running — including when every
  # search fails, which is the one case this entry exists to catch.
  # /api/health instead reports whether a real search worked recently
  # (observed from proxied traffic, with a background probe filling the
  # silence), which is knowable only to the shim.
  #
  # `kind: http` rather than `systemd` for that same reason, and the two
  # repositories agree on the ladder rather than merely coexisting: the
  # shim returns 424 when SearXNG answers but searching is broken and 503
  # when it does not answer at all, chosen against _check_http's mapping
  # of <500 -> degraded and >=500 -> critical. An upstream-engine outage
  # is therefore degraded (the fault is off this box), a dead container
  # critical.
  #
  # No `project:` — the subject of this check is SearXNG, third-party
  # software the estate hosts; the shim is the plumbing that makes it
  # monitorable, not the thing being judged. Attributing a 424 caused by
  # upstream engines to the estate-manager repository would charge it for
  # a fault it does not own. `mosquitto` above is the same shape.
  # `scope` omitted, so it defaults to user.
  - name: searxng
    kind: http
    url: http://localhost:8600/api/health
    port: 8600
    systemd: { unit: estate-manager-searxng-shim.service }
    log: { type: journalctl, severity_filter: warning }

  # SearXNG's own container, the 8601 half of the deploy above. Declared
  # rather than omitted, and deliberately NOT checked.
  #
  # `monitor: false` is the point of the entry. Its health is already
  # reported — a container that is down makes the shim return 503, which
  # is one fault with one owner and one alert row. But leaving it out of
  # this file entirely would put it in the unit sweep's `host` findings
  # permanently, where it can never be actioned, and would make "watched
  # through the shim on purpose" indistinguishable from "nobody wired it
  # up". `venture-chat-large` above carries the same shape for the same
  # reason.
  #
  # `controllable: false`: this is estate-manager's container, pinned by
  # digest and started with a secret from its own EnvironmentFile.
  # Restarting it from the tray would take the shim's dependency out from
  # under it, and operating it is that repository's business.
  #
  # No `log:` on purpose. The shim's /api/health already reports search
  # failures with their unresponsive engines, and pointing the aggregator
  # at a chatty third-party container is how SNAG-AGENT-002 happened.
  - name: searxng-upstream
    kind: systemd
    monitor: false
    reason: >-
      SearXNG's own container on loopback :8601, reachable only through
      the estate's shim on 8600; a container that is down already shows
      up there as a 503, and checking both would give one fault two
      alert rows
    systemd: { unit: estate-manager-searxng.service }
    controllable: false

  # Reachability probe. Deliberately has no unit: nothing on this machine
  # serves it, which is why `kind: http` asserts a unit only when one is
  # named.
  - name: internet
    kind: http
    url: https://1.1.1.1/cdn-cgi/trace

  # The only database backup on the box. `controllable: false` because
  # start/stop here would arm or disarm the schedule.
  - name: pgbackrest-backup-timer
    kind: timer
    systemd: { unit: pgbackrest-backup.timer, scope: system }
    controllable: false

  # --- Wired 2026-08-15, Session 48 -------------------------------------
  # The first entries in this file produced by pasting `GET
  # /api/units/actions` output rather than by hand. Three of the five
  # host findings; the other two are `deadlock-api-ingest.service`
  # (system) and its updater timer, both disabled and inactive, which
  # the advice now declines to wire up because a check on a unit nothing
  # starts fails on every poll for ever. They stay in the sweep's host
  # findings until someone enables or removes them — that decision is
  # the box owner's and it is a real one, unlike `searxng-upstream`
  # above, which is healthy and checked elsewhere.

  # Boot-time NIC tuning. Type=oneshot with RemainAfterExit=yes, so it
  # stays `active (exited)` once applied and `kind: systemd` is a real
  # check: inactive here means the tweaks are not in force. Note this is
  # the one oneshot on the box with no timer that is still monitorable,
  # which is why it is not folded.
  - name: ethernet-optimise
    kind: systemd
    systemd: { unit: ethernet-optimise.service, scope: system }
    log: { type: journalctl, severity_filter: warning }

  # Pacman cache trimming, monitored as its TIMER — the service is
  # Type=oneshot and inactive between runs by design, so watching the
  # service would alert continuously. `controllable: false` because
  # start/stop would arm or disarm the schedule, as with
  # pgbackrest-backup-timer above.
  - name: paccache-timer
    kind: timer
    systemd: { unit: paccache.timer, scope: system }
    controllable: false

  # Deadlock replay ingest, USER scope. The system-scope unit of the
  # same name is a different binary (/opt/deadlock-api-ingest) and is
  # disabled — scope is part of a unit's identity here, which is why the
  # generated name carries the `-user` suffix and why two tray tiles
  # cannot end up sharing one label.
  - name: deadlock-api-ingest-user
    kind: systemd
    # No listening port attributed to this unit by the port sweep, so
    # `kind: systemd` asserts liveness only. If it ever serves HTTP,
    # this should become kind: http with a url (SNAG-UNITS-001).
    systemd: { unit: deadlock-api-ingest.service, scope: user }
    log: { type: journalctl, severity_filter: warning }
