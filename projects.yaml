# Managed projects: endpoints to health-check, logs to aggregate, and
# optional per-project overrides.
#
# alert_threshold: health-score floor below which the project organiser
#   raises a warning alert. Omit it to use the global
#   agents.project_organiser.alert_threshold (40). Matched against the
#   scanned project by path first, then by this name, then by the
#   basename of `path` — so an entry named `personal-assistant` pointing
#   at a `PersonalAssistant` directory still applies. Example:
#
#   - name: some-archive
#     path: /home/gaddi/projects/some-archive
#     alert_threshold: 0     # never alert — deliberately dormant
#
projects:
  - name: personal-assistant
    path: /home/gaddi/projects/personal-assistant
    backend:
      url: http://localhost:8000/api/health
      port: 8000
      systemd_unit: personal-assistant-backend.service
      log:
        type: journalctl
        unit: personal-assistant.service
        severity_filter: warning
    frontend:
      url: http://localhost:3000
      port: 3000
      systemd_unit: personal-assistant-frontend.service
      log:
        type: journalctl
        unit: personal-assistant.service
        severity_filter: warning

  - name: sysadmin-service
    path: /home/gaddi/projects/sysadmin_assistant
    backend:
      url: http://localhost:8500/health
      port: 8500
      systemd_unit: sysadmin.service
      log:
        type: journalctl
        unit: sysadmin.service
        severity_filter: warning

  - name: sports_analyser
    path: /home/gaddi/projects/sports_analyser
    backend:
      url: http://localhost:8200/api/v1/health
      port: 8200

  - name: daiy
    path: /home/gaddi/projects/daiy