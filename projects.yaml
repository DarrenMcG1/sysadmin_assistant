projects:
  - name: personal-assistant
    path: /home/gaddi/projects/personal-assistant
    backend:
      url: http://localhost:8000/health
      port: 8000
      systemd_unit: personal-assistant.service
      log:
        type: journalctl
        unit: personal-assistant.service
        severity_filter: warning
    frontend:
      url: http://localhost:3000
      port: 3000

  - name: sysadmin-service
    path: /home/gaddi/projects/sysadmin_assistant
    backend:
      url: http://localhost:8500/health
      port: 8500
      systemd_unit: sysadmin.service
      log:
        type: journalctl
        unit: sysadmin.service
        severity_filter: warning
