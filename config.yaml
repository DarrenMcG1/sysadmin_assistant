service:
  name: sysadmin-service
  port: 8500
  host: 127.0.0.1
  log_level: info
  log_format: json  # json | text
  cors_origins:  # browser origins allowed to call the API from a web UI
    - http://localhost:3000
    - http://127.0.0.1:3000
    - http://localhost:3100   # Alfred frontend (Nuxt) — see ideas.md web-UI item
    - http://127.0.0.1:3100

# API authentication — bearer token checked on state-changing endpoints
# (service actions, scans, stale-cache clean, DND toggle, alert ack).
# Read-only GET endpoints stay open (the tray and any dashboard keep working).
# Generate a token with:  python -c "import secrets; print(secrets.token_hex(32))"
# Leave empty to disable auth (a warning is logged at startup).
# Clients (the tray app, and any future web UI) send:  Authorization: Bearer <token>
# NOTE: this file is committed to git — set a real token locally, do not commit it.
api:
  auth_token: ""

database:
  url: postgresql+asyncpg://gaddi@localhost:5432/projects
  sync_url: postgresql+psycopg2://gaddi@localhost:5432/projects
  schema: sysadmin

# PersonalAssistant integration — DORMANT since 2026-07-24.
# PA was retired and its replacement, Alfred, exposes no inbox: nothing in
# its API accepts notifications, briefings or digests. `enabled: false`
# makes the notifier skip the 06:00 briefing POST and the v2 notification
# sends before any HTTP call, logging once at INFO rather than warning per
# attempt. The endpoints below are kept so the integration can be repointed
# by editing the url/paths and flipping `enabled` back to true.
personal_assistant:
  enabled: false
  url: http://localhost:8000
  api_prefix: /api
  notify_endpoint: /api/v2/notifications/send
  briefing_endpoint: /api/v2/intelligence/briefing/data

# llama.cpp (llama-server) — OpenAI-compatible API.
# Serves one loaded model; `model` is informational (recorded with summaries).
llm:
  url: http://localhost:8081
  model: dria-agent-a-3b.Q4_K_M.gguf
  timeout_seconds: 120

notifications:
  # The DAEMON's own desktop notifications (sysadmin/monitor/desktop.py) —
  # the tray's understudy, not the tray. It stays silent whenever the tray
  # has polled /api/sysadmin/alerts within tray_grace_seconds, so the two
  # never both toast the same alert; it speaks when the tray is not
  # running, which was silent before 2026-08-11 (SNAG-CFG-001 — this
  # section was parsed and read by nothing).
  #
  # It notifies once per INCIDENT, not once per alert row: the monitor
  # writes one row per failed check (186 rows for one venture-assistant
  # outage), so a toast per row would be unusable. A title with another
  # unresolved alert already open is treated as ongoing and stays quiet.
  #
  # To change how loud the TRAY is, edit tray.notify_min_severity (~line
  # 370). This setting does not affect it.
  desktop:
    enabled: true
    min_severity: warning
    tray_grace_seconds: 180  # 3× the tray's alert_poll_seconds
    # Hours a fault this daemon announced stays quiet before it is
    # restated (SNAG-TRAY-007).  0 disables reminders.  The same 24 as
    # the tray's notifications.tray.reminder_hours and derived the same
    # way — it matches self_monitor.escalate_after_hours, so a family
    # that owns a ladder reaches its loud rung as news before any
    # reminder of its quiet rung is due.  The sweep that delivers it runs
    # every tray_grace_seconds; it has no leaf of its own on purpose.
    reminder_hours: 24
  pa_notify:
    enabled: true
    min_severity: critical
  dnd:
    enabled: false
    schedule:
      - start: "23:00"
        end: "07:00"
    allow_critical: true
  # Tray "notification calm" tunables (sysadmin_tray/notifications.py).
  # The backend's own DND above and the desktop's DND (KDE Do Not Disturb /
  # screen sharing, read from org.freedesktop.Notifications Inhibited) are
  # complementary — the more restrictive of the two wins, and only the
  # backend DND's allow_critical decides whether criticals break through.
  tray:
    flap_cooldown_minutes: 30      # quiet window per alert fingerprint; repeats roll into "flapped N×"
    escalation_polls: 3            # failing polls before a critical goes from quiet to persistent
    coalesce_threshold: 2          # new alerts in one poll at/above this become a single summary
    snooze_minutes: 60             # "Snooze 1h" notification button
    digest_mode: false             # true → warnings only badge the icon, delivered as a digest
    digest_interval_minutes: 60
    respect_desktop_dnd: true
    # Hours a still-open alert stays quiet before the tray restates it
    # (0 disables). SNAG-ESTATE-003: five families deduplicate on an open
    # row, so each rings once and is then silent while the fault stands —
    # and a warning that fires once is indistinguishable from one that
    # got fixed. DERIVED, not picked: it matches self_monitor's
    # escalate_after_hours (~line 139) so that a family which owns a
    # ladder reaches its loud rung as news rather than as a repeat it has
    # already heard quietly. Shorten it and the escalation stops being
    # the first thing you hear twice.
    reminder_hours: 24
    # Seconds an unreachable backend is tolerated before the tray says so
    # (0 disables the family). SNAG-TRAY-009: across the 2026-08-22 outage
    # the tray polled a dead daemon for 22.2 hours across two sessions,
    # displayed a grey icon and never interrupted anyone.
    #
    # DERIVED, not picked: max(3 × status_poll_seconds, 300). The 3 is
    # self_monitor.stall_grace_multiplier (~line 137) — one missed
    # observation is merely late — and the 300 floor is that section's
    # min_stall_grace_seconds, whose stated reason is "so a restart
    # doesn't flag" the fastest agent. The FLOOR is what does the work:
    # status_poll_seconds is 10 in the tray model and 30 in this file, so
    # the multiple alone spans 30–90 s while the noise it must clear does
    # not move with the poll interval at all.
    #
    # Checked against the box rather than reasoned about: 30 days hold 104
    # deploy restarts of 2, 3, 12 or 13 s (max 13 s) and 27 tray-observed
    # unreachable windows of exactly 60.0 s — one missed poll — against a
    # real fault of 5h 04m. 300 s is 23× the restart bound and 1.6 % of
    # the shorter outage. Do NOT lower this towards the poll interval: at
    # 3.5 deploys a day the family becomes noise and gets muted.
    backend_unreachable_grace_seconds: 300
    # Services that are expected to be down — never worth a toast. Use the
    # monitored-service name, including the ones projects.yaml contributes
    # (e.g. alfred, alfred-frontend). A service declared below with
    # `mute: true` is added to this list automatically.
    mute_services: []

# Daily cron jobs (local server time)
schedules:
  briefing_hour: 6      # morning briefing (generated; send dormant — see personal_assistant)
  briefing_minute: 0
  # The weekly reviews take a GPU lease from the estate's arbiter on 8400
  # and wait for the grant (SNAG-SCHED-003). Their wait budget ends this
  # many minutes before the briefing above — one deadline, three budgets
  # derived from it at dispatch, because the arbiter grants one lease at a
  # time FIFO across every profile and all three are therefore waiting for
  # the same instant.
  #
  # Past the deadline the deterministic digest is served and no lease is
  # asked for. That is a real trade rather than a free one: the briefing
  # runs daily and `_REVIEW_FRESH_DAYS` is 8, so a narrative landing at
  # 06:10 would still reach Tuesday-to-Sunday's briefings — what the
  # deadline gives up is the rest of the week to guarantee the Monday one.
  #
  # 5 minutes is ~15x the worst observed chain (a generation takes
  # 0.78-5.85 s; the arbiter ticks every 5 s; three serialised grants land
  # inside ~20 s) and every derived budget clears the whole measured
  # release band of venture-enrich-nightly, 05:45:15 to 05:47:18. Do NOT
  # replace this with estate-manager's REVIEW_WAIT_SECONDS of 1800:
  # `Arbiter._drop_overdue_waiters()` runs before the grant in every tick,
  # so 1800 s from 05:00 is dropped at 05:30 and from 05:15 at 05:45:00 —
  # before five of the six recorded releases (their message dcae132c).
  review_lease_margin_minutes: 5
  retention_hour: 3     # data retention purge
  retention_minute: 0
  # Daily reliability snapshot — deliberately an hour AHEAD of the retention
  # purge, so the day's score is written before the health checks it was
  # computed from can be deleted out from under it.
  reliability_hour: 2
  reliability_minute: 0
  # APScheduler schedules an interval job's FIRST run at now + interval, so
  # an agent whose interval is longer than the uptime between restarts never
  # fires (this is why file_organiser, at 24h, had zero recorded runs).
  # Hours-scale agents get an explicit first run this many seconds after start.
  agent_first_run_delay_seconds: 60

# Self-monitoring — /api/sysadmin/self reads agent_runs and the SysAdmin agent
# alerts when an agent silently stops running.
# stall window = agent interval × stall_grace_multiplier, floored at
# min_stall_grace_seconds (so a restart doesn't flag the 60s log aggregator).
self_monitor:
  enabled: true
  stall_grace_multiplier: 3.0
  min_stall_grace_seconds: 300
  recent_runs: 10          # runs per agent used for the duration trend
  # Session 39. Detection was never the problem: the file_organiser stall
  # on 2026-08-10 was caught correctly and alerted once, at `warning`, and
  # then went silent for a day while still being true. A warning toast is
  # TRANSIENT — it expires whether or not anyone was in the room. `critical`
  # is the only severity the tray leaves on screen (notifications.py sets
  # transient=False for it alone), so the second rung is about persistence,
  # not volume.
  #
  # The clock starts when the FIRST alert was raised, not when the stall
  # began — otherwise a restart after a long outage escalates all five
  # agents at once, charging the estate for this service's own downtime.
  #
  # 24h is measured against the slowest agent (file_organiser and
  # service_discovery run daily): a shorter gap escalates stalls that were
  # about to clear on their own. Lowering it makes the persistent alarm
  # arrive sooner; it does NOT make detection faster — that is
  # stall_grace_multiplier above.
  escalate_after_hours: 24

# Server-Sent Events stream — GET /api/sysadmin/events (push instead of polling)
events:
  heartbeat_seconds: 20    # keepalive comment interval on an idle stream
  max_queued_events: 100   # per-client buffer; oldest dropped when full
  retry_ms: 5000           # client reconnect hint

agents:
  sysadmin:
    enabled: true
    health_check_interval_seconds: 300
    # Per-service topology lives in services.yaml, keyed by project id.
    # It was in two files before — here and projects.yaml — and seven of
    # the eleven entries that used to sit here were project units filed
    # under "sysadmin" only because projects.yaml modelled exactly one
    # backend and one frontend and could not express a third unit.
    thresholds:
      disk_warning_percent: 80
      disk_critical_percent: 90
      ram_warning_percent: 85
      cpu_sustained_percent: 90
      cpu_sustained_minutes: 10
      gpu_temp_warning_c: 90
      gpu_vram_warning_percent: 90
    # Z-score anomaly detection against resource_snapshots history —
    # catches unusual-for-this-machine values below the fixed thresholds.
    anomaly:
      enabled: true
      window_days: 7        # rolling window for mean/stdev
      z_threshold: 3.0      # flag when |z| >= this
      min_samples: 30       # cold-start guard — fewer snapshots, no flagging
      min_stdev: 1.0        # skip near-constant series (no infinite z-scores)
      severity: warning
    # Stale collation detection (SNAG-DB-002). A glibc upgrade changes
    # libc's sort order; PostgreSQL records the version each database was
    # created with so it can tell you it no longer matches. Any B-tree
    # index on text was built against the old ordering, so a lookup can
    # miss a row that is present — which here would present as an alert
    # that never deduplicates or never resolves. Eight of this box's
    # eleven databases are stale as of 2026-08-13.
    #
    # One row per database, raised once per open row and NOT once per
    # run: the fault persists until someone reindexes, and this agent
    # polls every 300s, so the raise-every-run pattern used by
    # `thresholds:` above would write 2,304 rows a day for it. That is
    # why this family is absent from RESOLVABLE_TITLE_PATTERNS and
    # resolves its own rows — the two mechanisms are mutually exclusive.
    #
    # The fix is deliberately NOT automated: `REINDEX DATABASE` on a
    # 16 GB database touching two other apps' data wants a quiet window
    # and a human. The alert carries both statements in order, because
    # `REFRESH COLLATION VERSION` alone clears the warning without
    # rebuilding anything — a loud known risk turned into a silent one.
    collation:
      enabled: true
    # Per-service reliability scoring — GET /api/services/reliability.
    # Score = 100 - downtime (100 - uptime%, cap 60) - instability
    # (5 per outage episode, cap 25). A gap in the check series means the
    # MONITOR was down, so it never deducts; it lowers `confidence`.
    # A service marked `mute: true` above (or listed in
    # notifications.tray.mute_services) has its deductions computed and
    # reported but not applied.
    reliability:
      enabled: true
      # Capped in practice by service_health retention (30 days) —
      # widening this without widening retention silently narrows the
      # window to whatever survives the nightly purge.
      window_days: 7
      grade_bands:  # higher than the project bands: a service down a
                    # fifth of the week is not "healthy" by any reading
        reliable_min: 95
        degraded_min: 85
        unreliable_min: 60

    # Session 25 Tier 2 — GET /api/services/actions, the advice half of
    # the score above. Advice only; the endpoint is GET-only and a test
    # asserts it.
    service_actions:
      enabled: true
      # Invented, and the class docstring says so. One outage is an
      # outage and two could be one fault with a brief recovery in the
      # middle; nothing here measures where the line actually falls.
      flap_min_episodes: 3
      # NOT invented — this is self_monitor.stall_grace_multiplier's 3.0
      # for its own reason: a schedule that has missed one firing is
      # merely late and clears itself on the next tick. Two misses is a
      # pattern. Changing one of these two without the other makes a
      # single judgement disagree with itself.
      timer_stale_multiplier: 3.0
      # Deliberately wider than reliability.window_days above. A cadence
      # belongs to the schedule, not to the scoring window:
      # estate-manager-review-timer is weekly, so 7 days holds one firing
      # and therefore zero intervals. Capped by service_health retention
      # exactly as window_days is.
      timer_lookback_days: 30
      limit: 20


  project_organiser:
    # The organiser lives in the estate's 8400 service since Session 4
    # (ADR-0005) — this daemon no longer constructs, schedules or
    # self-monitors it (`agent_schedules()` dropped the entry in Session
    # 43, so nothing here reads these values any more). The block
    # survives as recorded config debt: the files domain still reads
    # `projects_root` for its safety fence, and the classes fan out into
    # the defaults tests. Retire it with the frozen project tables — see
    # the tasks.md entry.
    enabled: false
    scan_interval_hours: 6
    projects_root: /home/gaddi/projects
    stale_branch_days: 30
    track_todos: true
    todo_patterns:
      - "TODO"
      - "FIXME"
      - "HACK"
      - "XXX"
    grade_bands:  # health_score thresholds → healthy / needs_attention / neglected / abandoned
      healthy_min: 80
      needs_attention_min: 60
      neglected_min: 40
    alert_threshold: 40  # global health floor; override per project in projects.yaml
    max_todo_penalty: 30  # ceiling on the TODO/FIXME deduction (null = uncapped)
    # estate.json — the scanner's output contract, rewritten on every run.
    # Versioned and written atomically (temp file + rename) because it is
    # read by things this repository does not own. `health` inside it is
    # derived each run from the same rubric the board uses and is never
    # stored there, so scoring can change without a migration.
    estate:
      enabled: true
      path: estate.json          # relative paths resolve against projects_root
      # Commits that touched a repository without being work in it. A
      # single sweep across forty repos leaves every one looking active on
      # the same day, which is the opposite of what a staleness figure is
      # for. Two exist here and neither is a variant of the other, so this
      # is a list: with only the reorganisation snapshot, the roadmap
      # fan-out still shadows it and eleven projects read as touched last
      # week. Every staleness figure downstream is computed from
      # last_code_commit; last_commit is still published beside it so the
      # difference is visible rather than applied silently.
      code_commit_ignore:
        message_patterns:
          - "WIP snapshot before ~/projects reorganisation"
          - "^Add roadmap document set$"
        shas: []
        max_walk: 200

    # Idle nudges — "you said you would and haven't" (Session 31). Not a
    # hygiene check: an active project with a human-written next action
    # that has not changed for `days`. Dormant and archived projects have
    # made their decision, and a project with no stated action has nothing
    # to be reminded of, so neither is eligible.
    #
    # The 7-day rung is SILENT on this host by design: tray.notify_min_severity
    # (line ~353, NOT notifications.desktop.min_severity, which nothing reads —
    # SNAG-CFG-001) is `warning`, so the info nudge marks the alerts list and
    # the tray badge without speaking, and the 14-day escalation is the first
    # thing that toasts. If nudges arrive too late, lower that to `info`
    # rather than shortening `days` — the threshold is about when a
    # commitment counts as broken, not about loudness.
    #
    # A project may override the threshold with `idle_nudge_days` in its
    # own .project.yaml (e.g. a long-cycle repo where a fortnight is normal).
    idle_nudges:
      enabled: true
      days: 7            # info nudge after this many days unchanged
      escalate_days: 14  # the open nudge becomes a warning here

    branch_actions:  # POST /api/projects/{name}/branches/prune — dry run unless confirm=true
      enabled: true
      protected_branches:  # globs never deleted (the default branch is protected regardless)
        - "main"
        - "master"
        - "develop"
        - "release/*"
      allow_unmerged_delete: false  # + include_unmerged on the request; both needed
      max_deletions: 20  # hard cap per call
      min_stale_days: 7  # floor on the staleness window a request may ask for

  file_organiser:
    enabled: true
    scan_interval_hours: 24
    scan_root: /home/gaddi
    output_dir: /home/gaddi/Documents/DMDocs/Self/Briefings/Audits
    stale_days: 180
    downloads_stale_days: 30
    large_file_mb: 100
    similarity_threshold: 0.75
    reclaimable_milestones_mb:  # /api/files/trends projects dates these are reached
      - 1024    # 1 GB
      - 5120    # 5 GB
      - 10240   # 10 GB
    skip_dirs:
      - .git
      - .cache
      - .local
      - .config
      - .var
      - .mozilla
      - .steam
      - node_modules
      - __pycache__
      - .venv

    # Mutating file actions — POST /api/files/organise and /api/files/clean/*.
    # These MOVE and DELETE real files, so every endpoint is a dry run unless
    # the request body sets `confirm: true`, is bearer-token protected, is
    # confined to scan_root, never follows symlinks, never enters .git /
    # node_modules / dotdirs / the projects root, never overwrites an
    # existing destination, and "delete" means "move to the XDG trash".
    actions:
      enabled: true
      # category → destination folder (relative to scan_root, or absolute).
      # Retarget a category here rather than in code.
      category_folders:
        images: Pictures
        videos: Videos
        documents: Documents
        audio: Music
        books: Books
        archives: Archives
      downloads_dir: Downloads
      archive_dir: Archives/Downloads   # where `mode: archive` files land
      duplicate_strategy: newest        # newest | largest — which copy survives
      # PDFs route to Books/ only on positive evidence (filename markers or a
      # cheaply-read page count); otherwise they go to Documents/.
      pdf_book_min_pages: 50
      pdf_book_min_mb: 5.0
      max_operations: 200               # hard cap per action manifest
      # Last-resort permanent deletion when the trash is unusable (e.g. the
      # file is on another filesystem). Requires force_delete in the request
      # AS WELL as this flag. Leave false — trashing is reversible.
      allow_permanent_delete: false
      # trash_dir:                      # default <scan_root>/.local/share/Trash
      # Loose code files in the scan root are FLAGGED for review, never moved
      code_extensions:
        - .py
        - .js
        - .ts
        - .tsx
        - .jsx
        - .go
        - .rs
        - .c
        - .cpp
        - .h
        - .hpp
        - .java
        - .rb
        - .sh
        - .php
        - .lua
        - .sql

  # Service discovery (Session 26) — cross-references the units installed
  # on this box against the projects on disk and the units already wired
  # above.  Advice only: it never edits this file or projects.yaml, both
  # of which are hand-curated and carry their reasoning in comments.
  #
  # Distro units are skipped by a symlink test, not a package query:
  # `systemctl enable` installs a symlink into /usr/lib/systemd/system,
  # so every packaged unit under /etc is a link and every hand-written
  # one is a real file.
  service_discovery:
    enabled: true
    scan_interval_hours: 6
    user_unit_dir: ~/.config/systemd/user
    system_unit_dir: /etc/systemd/system
    # Count of actionable findings above which ONE rolled-up alert is
    # raised — re-raised only when the count changes, and auto-resolved
    # when it drops back under.  Per-unit alerts would repeat
    # SNAG-AGENT-002.  Set to 0 to record findings and never alert.
    alert_threshold: 5

  # The judging swap (ADR-0005; estate-manager ADR-0004 §6). The estate
  # manager publishes and never acts — it files audit findings rather
  # than alerting, and it never grades its own scan. This agent reads its
  # five published surfaces on 8400 and decides what wakes a human.
  #
  # Hourly, not at the sysadmin agent's 300 s: the producers change twice
  # a day (scan 04:30, audit 05:03) and /api/projects/attention re-walks
  # ~26 .project.yaml manifests from disk on every request.
  estate_judge:
    enabled: true
    # Must agree with estate-manager-api's url in services.yaml. Not
    # derived from it deliberately: renaming that service, or setting
    # `monitor: false` on it, would silently stop the judging for an
    # unrelated reason. A test asserts the two agree instead.
    base_url: http://localhost:8400
    poll_interval_hours: 1
    # DERIVED, not chosen: estate-manager-scan.timer is daily at 04:30
    # and estate-manager-audit.timer daily at 05:03, so 26h is one
    # interval plus the same two-hour margin the briefing already uses
    # for facts.stale_sources. Shorter alerts on a timer that is late.
    scan_max_age_hours: 26
    audit_max_age_hours: 26
    # INVENTED, and flagged as such. Nothing on this box records what a
    # normal GPU queue looks like — until estate-manager's Session 3
    # there was no queue. Move these once a busy day has been observed.
    #
    # The busy day arrived 2026-08-30 (estate message d1939cf7) and
    # queue_max_wait_seconds deliberately STAYED at 900. The estate's
    # weekly review now queues behind venture-enrich-nightly every
    # Monday for 915-1038 s, which is over this number — but raising it
    # only alerts later on a queue that is working, and the Monday wait
    # belongs to another repository's timer. The gauge moved instead:
    # judge_queue_invariants reads oldest_unexplained_wait_seconds now.
    # Do not "fix" a Monday false alarm here; it will not be this leaf.
    queue_max_depth: 3
    queue_max_wait_seconds: 900
    # INVENTED, and a shape guard rather than a tolerance. Every breach
    # is worth a row; this decides when many of them stop being many
    # faults and start being the registry itself — moved, truncated or
    # re-formatted. The estate errors on an EMPTY parse of the table; a
    # partial one is the gap that leaves. Above this, one roll-up row
    # naming the ports in details, per SNAG-UNITS-002's refusal to ship
    # fifteen separate rows on a first run.
    port_breach_max_rows: 5
    # INVENTED, and the same shape of guard one surface over: above this
    # many health breaches, or this many idle nudges, in one poll, that
    # family collapses to one roll-up row naming the projects in details.
    # Counted separately per family — they have separate producers inside
    # the estate and fail separately.
    #
    # Measured, not guessed: 26 projects are scored, 12 are archived and
    # cannot breach at all (threshold 0 against a clamped score), leaving
    # 14; the eligible nudge population is 5. So five is just under
    # "every project that could", which is when the count stops being
    # repositories and starts being the estate's arithmetic — a threshold
    # moved in its config.yaml does that to all of them between two polls.
    # Session 52 measured 26 + 5 = 31 rows from one forced-population run.
    attention_max_rows: 5
    # There is deliberately no threshold for dropped_total, expired_total
    # or grants_total: they are lifetime count(*) values over gpu_leases,
    # so any rule on them raises a row no future state can clear. That is
    # redis unreachable's 6,283 rows arriving by a new route.

  log_aggregator:
    enabled: true
    poll_interval_seconds: 60
    # Only sources with no service to hang off. Everything that belongs
    # to a service is declared beside it in services.yaml, which is what
    # stopped sysadmin.service being ingested twice under two names.
    sources:
      - name: kernel
        type: journalctl
        unit: kernel
        severity_filter: error
    retention_days: 30
    # Session 27, Tier 3 — the weekly LLM-narrated log review at
    # GET /api/logs/review. Replaces summarise_with_llm, which gated a
    # method nothing called.
    weekly_review: true
    # SNAG-AGENT-005. One alert row is raised per distinct *fault
    # signature*, not per log line, and it stays open while the fault keeps
    # being logged — so silence is the only recovery signal there is, and
    # this is how long it has to last. 15 minutes is 15 polls above.
    alert_quiet_minutes: 15
    # Entries taken from one read of one source. A ceiling is unavoidable
    # (the kernel journal here has sustained 8.5 messages a second for
    # days); what changed is that hitting it is reported as
    # details['truncated_sources'] instead of showing up as a findings
    # count that never moves.
    #
    # Left at 500: the severity filter is now passed to journalctl as -p,
    # so this bounds storable entries rather than raw lines. Across the
    # 2026-08-12 storm that is 81,216 of 203,042 lines the old read spent
    # its budget on — 40% useful, now 100%, for the same 500 and the same
    # rows stored. Steady kernel polling went from 510 raw lines a minute
    # against this ceiling to 204.
    max_entries_per_read: 500
    # GET /api/logs/trends compares two windows of this many days each.
    # Seven because the ask was week-on-week, and because 7 + 7 sits well
    # inside retention_days above — a window wider than retention narrows
    # itself to whatever survives the nightly purge without saying so.
    trend_window_days: 7
    # Ceiling on distinct (source, severity, message) groups the trend
    # query returns. Measured 2026-08-17: 626,906 rows collapse to 44
    # groups, so this does not bind on this box. It is here because that
    # collapse is a property of the data, not a bound — a service that
    # embeds a request id in every line has one group per line — and
    # hitting it is reported as `truncated` rather than inferred.
    trend_max_groups: 2000

tray:
  status_poll_seconds: 30
  resource_poll_seconds: 30
  alert_poll_seconds: 60
  show_notifications: true
  notify_min_severity: warning
  dashboard_url: http://127.0.0.1:8500/docs
