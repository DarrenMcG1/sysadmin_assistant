service:
  name: sysadmin-service
  port: 8500
  host: 127.0.0.1
  log_level: info
  log_format: json  # json | text
  cors_origins:  # browser origins allowed to call the API (PA frontend dev server)
    - http://localhost:3000
    - http://127.0.0.1:3000

# API authentication — bearer token checked on state-changing endpoints
# (service actions, scans, stale-cache clean, DND toggle, alert ack).
# Read-only GET endpoints stay open (tray + PA dashboards keep working).
# Generate a token with:  python -c "import secrets; print(secrets.token_hex(32))"
# Leave empty to disable auth (a warning is logged at startup).
# Clients (tray app, PA backend) send:  Authorization: Bearer <token>
# NOTE: this file is committed to git — set a real token locally, do not commit it.
api:
  auth_token: ""

database:
  url: postgresql+asyncpg://gaddi@localhost:5432/projects
  sync_url: postgresql+psycopg2://gaddi@localhost:5432/projects
  schema: sysadmin

personal_assistant:
  url: http://localhost:8000
  api_prefix: /api
  notify_endpoint: /api/v2/notifications/send
  briefing_endpoint: /api/v2/intelligence/briefing/data

# llama.cpp (llama-server) — OpenAI-compatible API.
# Serves one loaded model; `model` is informational (recorded with summaries).
llm:
  url: http://localhost:8081
  model: dria-agent-a-3b.Q4_K_M.gguf
  timeout_seconds: 120

notifications:
  desktop:
    enabled: true
    min_severity: warning
  pa_notify:
    enabled: true
    min_severity: critical
  dnd:
    enabled: false
    schedule:
      - start: "23:00"
        end: "07:00"
    allow_critical: true
  # Tray "notification calm" tunables (sysadmin_tray/notifications.py).
  # The backend's own DND above and the desktop's DND (KDE Do Not Disturb /
  # screen sharing, read from org.freedesktop.Notifications Inhibited) are
  # complementary — the more restrictive of the two wins, and only the
  # backend DND's allow_critical decides whether criticals break through.
  tray:
    flap_cooldown_minutes: 30      # quiet window per alert fingerprint; repeats roll into "flapped N×"
    escalation_polls: 3            # failing polls before a critical goes from quiet to persistent
    coalesce_threshold: 2          # new alerts in one poll at/above this become a single summary
    snooze_minutes: 60             # "Snooze 1h" notification button
    digest_mode: false             # true → warnings only badge the icon, delivered as a digest
    digest_interval_minutes: 60
    respect_desktop_dnd: true
    # Services that are expected to be down — never worth a toast. Use the
    # monitored-service name, including the ones projects.yaml contributes
    # (e.g. personal-assistant, personal-assistant-frontend). A service
    # declared below with `mute: true` is added to this list automatically.
    mute_services: []

# Daily cron jobs (local server time)
schedules:
  briefing_hour: 6      # morning briefing POSTed to PA
  briefing_minute: 0
  retention_hour: 3     # data retention purge
  retention_minute: 0
  # APScheduler schedules an interval job's FIRST run at now + interval, so
  # an agent whose interval is longer than the uptime between restarts never
  # fires (this is why file_organiser, at 24h, had zero recorded runs).
  # Hours-scale agents get an explicit first run this many seconds after start.
  agent_first_run_delay_seconds: 60

# Self-monitoring — /api/sysadmin/self reads agent_runs and the SysAdmin agent
# alerts when an agent silently stops running.
# stall window = agent interval × stall_grace_multiplier, floored at
# min_stall_grace_seconds (so a restart doesn't flag the 60s log aggregator).
self_monitor:
  enabled: true
  stall_grace_multiplier: 3.0
  min_stall_grace_seconds: 300
  recent_runs: 10          # runs per agent used for the duration trend

# Server-Sent Events stream — GET /api/sysadmin/events (push instead of polling)
events:
  heartbeat_seconds: 20    # keepalive comment interval on an idle stream
  max_queued_events: 100   # per-client buffer; oldest dropped when full
  retry_ms: 5000           # client reconnect hint

agents:
  sysadmin:
    enabled: true
    health_check_interval_seconds: 300
    # Add `mute: true` to a service that is expected to be down (it still
    # colours the tray icon and shows in the dashboard, but never toasts)
    services:
      - name: postgresql
        type: systemd
        systemd_unit: postgresql.service
        controllable: false
      - name: llama-server
        type: http
        url: http://localhost:8081/health
        systemd_unit: alfred-inference.service
        user: true  # systemd *user* unit
      - name: networkmanager
        type: systemd
        systemd_unit: NetworkManager.service
        controllable: false
      - name: internet
        type: http
        url: https://1.1.1.1/cdn-cgi/trace
    thresholds:
      disk_warning_percent: 80
      disk_critical_percent: 90
      ram_warning_percent: 85
      cpu_sustained_percent: 90
      cpu_sustained_minutes: 10
      gpu_temp_warning_c: 90
      gpu_vram_warning_percent: 90
    # Z-score anomaly detection against resource_snapshots history —
    # catches unusual-for-this-machine values below the fixed thresholds.
    anomaly:
      enabled: true
      window_days: 7        # rolling window for mean/stdev
      z_threshold: 3.0      # flag when |z| >= this
      min_samples: 30       # cold-start guard — fewer snapshots, no flagging
      min_stdev: 1.0        # skip near-constant series (no infinite z-scores)
      severity: warning

  project_organiser:
    enabled: true
    scan_interval_hours: 6
    projects_root: /home/gaddi/projects
    stale_branch_days: 30
    track_todos: true
    todo_patterns:
      - "TODO"
      - "FIXME"
      - "HACK"
      - "XXX"
    grade_bands:  # health_score thresholds → healthy / needs_attention / neglected / abandoned
      healthy_min: 80
      needs_attention_min: 60
      neglected_min: 40

  file_organiser:
    enabled: true
    scan_interval_hours: 24
    scan_root: /home/gaddi
    output_dir: /home/gaddi/Documents/DMDocs/Self/Briefings/Audits
    stale_days: 180
    downloads_stale_days: 30
    large_file_mb: 100
    similarity_threshold: 0.75
    reclaimable_milestones_mb:  # /api/files/trends projects dates these are reached
      - 1024    # 1 GB
      - 5120    # 5 GB
      - 10240   # 10 GB
    skip_dirs:
      - .git
      - .cache
      - .local
      - .config
      - .var
      - .mozilla
      - .steam
      - node_modules
      - __pycache__
      - .venv

    # Mutating file actions — POST /api/files/organise and /api/files/clean/*.
    # These MOVE and DELETE real files, so every endpoint is a dry run unless
    # the request body sets `confirm: true`, is bearer-token protected, is
    # confined to scan_root, never follows symlinks, never enters .git /
    # node_modules / dotdirs / the projects root, never overwrites an
    # existing destination, and "delete" means "move to the XDG trash".
    actions:
      enabled: true
      # category → destination folder (relative to scan_root, or absolute).
      # Retarget a category here rather than in code.
      category_folders:
        images: Pictures
        videos: Videos
        documents: Documents
        audio: Music
        books: Books
        archives: Archives
      downloads_dir: Downloads
      archive_dir: Archives/Downloads   # where `mode: archive` files land
      duplicate_strategy: newest        # newest | largest — which copy survives
      # PDFs route to Books/ only on positive evidence (filename markers or a
      # cheaply-read page count); otherwise they go to Documents/.
      pdf_book_min_pages: 50
      pdf_book_min_mb: 5.0
      max_operations: 200               # hard cap per action manifest
      # Last-resort permanent deletion when the trash is unusable (e.g. the
      # file is on another filesystem). Requires force_delete in the request
      # AS WELL as this flag. Leave false — trashing is reversible.
      allow_permanent_delete: false
      # trash_dir:                      # default <scan_root>/.local/share/Trash
      # Loose code files in the scan root are FLAGGED for review, never moved
      code_extensions:
        - .py
        - .js
        - .ts
        - .tsx
        - .jsx
        - .go
        - .rs
        - .c
        - .cpp
        - .h
        - .hpp
        - .java
        - .rb
        - .sh
        - .php
        - .lua
        - .sql

  log_aggregator:
    enabled: true
    poll_interval_seconds: 60
    sources:
      - name: postgresql
        type: journalctl
        unit: postgresql.service
        severity_filter: error
      - name: llama-server
        type: journalctl
        unit: alfred-inference.service
        user: true  # journalctl --user
        severity_filter: warning
      - name: sysadmin
        type: journalctl
        unit: sysadmin.service
        severity_filter: warning
      - name: kernel
        type: journalctl
        unit: kernel
        severity_filter: error
    retention_days: 30
    summarise_with_llm: true

tray:
  status_poll_seconds: 30
  resource_poll_seconds: 30
  alert_poll_seconds: 60
  show_notifications: true
  notify_min_severity: warning
  dashboard_url: http://127.0.0.1:8500/docs
