[project]
name = "sysadmin-service"
version = "0.1.0"
description = "Infrastructure monitoring and housekeeping service with systemd integration"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "psycopg2-binary>=2.9.0",
    "python-json-logger>=3.0.0",
    # Estate-shared in-process mechanism: llama-server client core and the
    # truncation marker (estate-manager ADR-0006, this repo's ADR-0004).
    "estate-lib",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
tray = [
    "PyQt6>=6.6.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.scripts]
sysadmin-tray = "sysadmin_tray.app:main"
# Called by sysadmin-failed.service when the daemon has entered `failed`.
# A console script rather than inline psql: the alert row must satisfy the
# same model and CHECK constraint the application writes through.
sysadmin-record-failure = "sysadmin.core.unit_failure:main"
# Called by sysadmin-replay-failures.service at login, to say out loud what
# the handler above could not because nobody was logged in to hear it. Four
# of that handler's five firings were boot-time, and the one row that was
# not fixed at once stayed open 37.73 hours. A console script rather than
# shell because the predicate is a database read and the row's own message
# is carried verbatim rather than rebuilt. SNAG-SYSD-005.
sysadmin-replay-failures = "sysadmin.core.failure_replay:main"
# Called by scripts/check-migrations.sh, which the pre-commit hook and the
# postflight script both run. A console script rather than a shell `psql`
# so the comparison is alembic's own ScriptDirectory against a
# schema-qualified alembic_version — the two rules schema_guard exists to
# state once. SNAG-DB-005.
sysadmin-check-schema = "sysadmin.core.schema_guard:main"
# Called by scripts/check-ops-claims.sh, which claude-preflight.sh and
# claude-postflight.sh both run. A console script rather than shell because
# the comparison needs create_app(), the packaged Alembic head and a
# database connection — three facts sysadmin/ops_claims.py states once.
# SNAG-ESTATE-008.
sysadmin-check-claims = "sysadmin.ops_claims:main"
# Called by scripts/check-snag-claims.sh, which claude-preflight.sh and
# claude-postflight.sh both run beside the ops claims. The snag list is the
# second document a sitting reads and was the only one nothing checked:
# Session 82 measured all thirty open entries by hand and found five dead
# on the box, three of them P1. The residue — the open entries no
# check yet names — is SNAG-ESTATE-014.
sysadmin-check-snags = "sysadmin.snag_claims:main"
# Run by hand, never scheduled. Repairs log_entries rows whose source
# gained `format: json` after they were ingested, so the read-time unwrap
# could never reach them (SNAG-LOG-008). A console script rather than a
# data migration: an Alembic revision would move the packaged head for no
# structural reason, obliging `alembic upgrade head` plus a restart or
# schema_guard refuses to boot — SNAG-DB-005's 23 hours bought for ten
# rows — and would fix this population once where the defect is a class.
# Dry run unless --confirm.
sysadmin-backfill-messages = "sysadmin.monitor.message_backfill:main"

[tool.uv.sources]
# Editable relative path, deliberately unversioned: one box, one committer,
# a change reaches this service at its next restart (estate ADR-0006 §4).
estate-lib = { path = "../estate-manager/lib", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sysadmin", "sysadmin_tray"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Historical migrations and the legacy standalone audit script keep their
# original formatting
"alembic/versions/*" = ["E501"]
"home_audit.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
# Lenient baseline — run with: uv run mypy sysadmin
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["alembic/", "tests/", "sysadmin_tray/"]
