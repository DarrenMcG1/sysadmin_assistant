[project]
name = "sysadmin-service"
version = "0.1.0"
description = "Infrastructure monitoring and housekeeping service with systemd integration"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "gitpython>=3.1.0",
    "psycopg2-binary>=2.9.0",
    "python-json-logger>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
tray = [
    "PyQt6>=6.6.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.scripts]
sysadmin-tray = "sysadmin_tray.app:main"
sysadmin-organiser = "sysadmin.projects.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sysadmin", "sysadmin_tray"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Historical migrations and the legacy standalone audit script keep their
# original formatting
"alembic/versions/*" = ["E501"]
"home_audit.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
# Lenient baseline — run with: uv run mypy sysadmin
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["alembic/", "tests/", "sysadmin_tray/"]
