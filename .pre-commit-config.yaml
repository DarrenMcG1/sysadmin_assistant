# The three gates, run when this repository is pushed (estate Rule 7,
# estate-manager's docs/conventions/estate-rules.md). Nothing here runs at
# commit: .git/hooks/pre-commit is scripts/claude-precommit.sh, written by
# hand, and default_install_hook_types keeps a bare `pre-commit install`
# from replacing it.
#
# `verbose: true` prints each gate's duration, so a push shows what it is
# doing while it runs. The stage's measured time is stated in CLAUDE.md.
#
# The full suite runs, in two halves. `box` tests read this machine, and a
# push runs on this machine, so they run live. The rest run with no database
# to reach (scripts/pytest-without-the-box.sh), as CI runs them, so a test
# that reads the database without the mark fails here rather than on GitHub
# (SNAG-TEST-019).
#
# .venv/bin directly rather than `uv run`, so a push never syncs the
# environment. Installing the stage is the owner's step, for the reason the
# rule gives.

default_install_hook_types: [pre-push]

repos:
  - repo: local
    hooks:
      - id: pytest-box
        name: pytest -m box
        entry: .venv/bin/python -m pytest -q -m box
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
      - id: pytest-without-the-box
        name: pytest -m "not box", no database
        entry: scripts/pytest-without-the-box.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
      - id: ruff
        name: ruff check
        entry: .venv/bin/ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
      - id: mypy
        name: mypy sysadmin
        entry: .venv/bin/mypy sysadmin
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
